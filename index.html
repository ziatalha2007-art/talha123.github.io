<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Talha AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #0b1020;
    color: white;
    height: 100vh;
}

.app {
    display: flex;
    height: 100vh;
}

.sidebar {
    width: 250px;
    background: #111827;
    padding: 20px;
    border-right: 1px solid #263044;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 30px;
}

.newchat {
    width: 100%;
    padding: 13px;
    border: 1px solid #374151;
    border-radius: 10px;
    background: #1f2937;
    color: white;
    cursor: pointer;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
}

.header {
    padding: 18px 25px;
    border-bottom: 1px solid #263044;
    font-size: 20px;
    font-weight: bold;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px;
}

.message {
    max-width: 750px;
    margin: 0 auto 20px;
    padding: 15px 18px;
    border-radius: 14px;
    line-height: 1.6;
}

.ai {
    background: #172033;
}

.user {
    background: #2563eb;
}

.input-area {
    padding: 20px;
    border-top: 1px solid #263044;
}

.input-box {
    max-width: 800px;
    margin: auto;
    display: flex;
    gap: 10px;
}

input {
    flex: 1;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #374151;
    background: #111827;
    color: white;
    outline: none;
    font-size: 16px;
}

button {
    padding: 15px 20px;
    border: none;
    border-radius: 12px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #1d4ed8;
}

@media (max-width: 700px) {
    .sidebar {
        display: none;
    }

    .chat {
        padding: 15px;
    }

    .input-area {
        padding: 12px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">
        <div class="logo">🤖 Talha AI</div>

        <button class="newchat" onclick="newChat()">
            ＋ New Chat
        </button>
    </aside>

    <main class="main">

        <div class="header">
            Talha AI
        </div>

        <div class="chat" id="chat">

            <div class="message ai">
                👋 Hello! I am <b>Talha AI</b>.<br>
                Ask me anything.
            </div>

        </div>

        <div class="input-area">

            <div class="input-box">

                <input
                    id="messageInput"
                    type="text"
                    placeholder="Message Talha AI..."
                    onkeydown="handleKey(event)"
                >

                <button onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </main>

</div>

<script>

const WORKER_URL =
"https://lingering-math-807atalha-ai.ziatalha2007.workers.dev/";

async function sendMessage() {

    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text) return;

    const chat = document.getElementById("chat");

    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = text;

    chat.appendChild(userMessage);

    input.value = "";

    const loading = document.createElement("div");
    loading.className = "message ai";
    loading.textContent = "🤔 Thinking...";
    chat.appendChild(loading);

    chat.scrollTop = chat.scrollHeight;

    try {

        const response = await fetch(WORKER_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                message: text
            })

        });

        const data = await response.json();

        loading.remove();

        const aiMessage = document.createElement("div");
        aiMessage.className = "message ai";

        if (data.answer) {
            aiMessage.textContent = data.answer;
        } else {
            aiMessage.textContent =
                "❌ Error: " + (data.error || "AI response nahi mila.");
        }

        chat.appendChild(aiMessage);

    } catch (error) {

        loading.remove();

        const errorMessage = document.createElement("div");
        errorMessage.className = "message ai";
        errorMessage.textContent =
            "❌ Server se connection nahi ho saka.";

        chat.appendChild(errorMessage);
    }

    chat.scrollTop = chat.scrollHeight;
}

function handleKey(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

}

function newChat() {

    document.getElementById("chat").innerHTML = `
        <div class="message ai">
            👋 New chat started!<br>
            How can I help you?
        </div>
    `;

}

</script>

</body>
</html>
